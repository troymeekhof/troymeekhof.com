<!doctype html><html lang="en" data-persona="tcg"><head><meta charset="utf-8">
<link rel="preload" href="/assets/fonts/advercase-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
html,body{margin:0;background:var(--ground)}
.card{width:1200px;height:630px;box-sizing:border-box;display:grid;grid-template-columns:600px 600px;background:var(--ground);color:var(--ink);font-family:var(--sans);position:relative;overflow:hidden}
.l{padding:48px 40px 40px 56px;display:flex;flex-direction:column}
.l .label{font-size:16px;margin:0 0 14px}
.l h1{font-family:var(--display);font-weight:400;font-size:58px;line-height:1.02;margin:0;letter-spacing:-.01em}
.l h1 em{font-style:normal;color:var(--em)}
.st{display:grid;grid-template-columns:1fr 1fr;margin-top:auto;border-top:1px solid var(--line)}
.st div{padding:16px 14px 14px 0;border-bottom:1px solid var(--line)}
.st div:nth-child(2n){padding-left:18px;border-left:1px solid var(--line)}
.st b{display:block;font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.st span{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.url{margin-top:18px;font-size:16px;color:var(--muted);font-weight:500}
.url b{color:var(--ink);font-weight:600}
.r{position:relative;padding:40px 40px 40px 0}
.r img{width:560px;height:550px;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.pin{position:absolute;right:58px;top:58px;display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:999px;background:rgba(16,19,22,.88);border:1px solid rgba(255,255,255,.22);color:#c9d1d7;font-size:15px;font-weight:500;backdrop-filter:blur(6px)}
.pin b{color:#fff;font-weight:600}
.pin i{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px var(--glow)}
</style></head><body>
<div class="card">
 <div class="l">
  <p class="label">The Cybertruck Guy</p>
  <h1>Cybertruck stats: <em>miles, charging, FSD.</em></h1>
  <div class="st">
   <div><b>71,983</b><span>Cybertruck miles</span></div>
   <div><b>23,832</b><span>kWh Supercharged</span></div>
   <div><b>143</b><span>Supercharger sites</span></div>
   <div><b>75%</b><span>Miles on FSD</span></div>
  </div>
  <div class="url"><b>troymeekhof.com</b>/cybertruck/stats · updated weekly</div>
 </div>
 <div class="r"><img src=".og-map.png" alt=""><span class="pin"><i></i>Powered by <b>Autonimator</b></span></div>
</div></body></html>
